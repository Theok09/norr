name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary
        run: |
          mkdir -p out
          docker run --rm -e VERSION="${GITHUB_REF_NAME#v}" -v "$PWD":/src:ro -v "$PWD/out":/out \
            alpine:3.22 sh /src/scripts/build-static.sh
      - uses: actions/upload-artifact@v4
        with:
          name: norr-linux-${{ matrix.arch }}
          path: out/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
