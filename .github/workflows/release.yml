name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config \
            libsodium-dev libgnutls28-dev libngtcp2-dev libngtcp2-crypto-gnutls-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      # A release that fails its own tests is worse than no release.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage the install tree
        run: DESTDIR="$PWD/stage" cmake --install build

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.1.0-dev"
          ARCH=$(dpkg --print-architecture)
          NAME="norr-${VERSION}-linux-${ARCH}"

          tar -C stage -czf "${NAME}.tar.gz" .
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

          echo "NAME=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.tar.gz.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.tar.gz.sha256
