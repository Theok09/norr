name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config libsodium-dev libssl-dev \
            libgnutls28-dev libngtcp2-dev libngtcp2-crypto-gnutls-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Smoke check
        run: |
          ./build/norrd version
          ./build/norrd features
          bash -n scripts/norr
          sh -n scripts/norr-quick
          bash -n install.sh
